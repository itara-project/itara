nodes:
  - id: "gateway-aNode"
    component: "gateway-a"
  - id: "gateway-bNode"
    component: "gateway-b"
  - id: "backendNode"
    component: "backend"

connections:
  - id: "external-to-gateway-a"
    callee:
      nodeId: "gateway-aNode"
    transport:
      id: "http"
      params:
        host: "localhost"
        port: "8080"
    serializer:
      id: "json"

  - id: "external-to-gateway-b"
    callee:
      nodeId: "gateway-bNode"
    transport:
      id: "http"
      params:
        host: "localhost"
        port: "8090"
    serializer:
      id: "json"

  - id: "gateway-a-to-backend"
    caller:
      nodeId: "gateway-aNode"
    callee:
      nodeId: "backendNode"
      authorization:
        id: "rule-table"
        params:
          allow: "shout"
          deny: "whisper"
    transport:
      id: "direct"
    authentication:
      id: "shared-secret"
      params:
        secret: "s3cr3t-a"
        subject: "gateway-a"

  - id: "gateway-b-to-backend"
    caller:
      nodeId: "gateway-bNode"
      authentication:
        id: "shared-secret"
        params:
          secret: "incorrect-secret"
          subject: "gateway-b"
    callee:
      nodeId: "backendNode"
      authorization:
        id: "rule-table"
        params:
          allow: "shout"
          deny: "whisper"
      authentication:
        id: "shared-secret"
        params:
          secret: "s3cr3t-b"
          subject: "gateway-b"
    transport:
      id: "direct"