nodes:
  - id: "gateway-aNode"
    component: "gateway-a"
  - id: "gateway-bNode"
    component: "gateway-b"
  - id: "backendNode"
    component: "backend"

connections:
  - id: "external-to-gateway-a"
    callee:
      nodeId: "gateway-aNode"
    transport:
      id: "http"
      params:
        host: "localhost"
        port: "8080"
    serializer:
      id: "json"

  - id: "external-to-gateway-b"
    callee:
      nodeId: "gateway-bNode"
    transport:
      id: "http"
      params:
        host: "localhost"
        port: "8090"
    serializer:
      id: "json"

  - id: "gateway-a-to-backend"
    caller:
      nodeId: "gateway-aNode"
    callee:
      nodeId: "backendNode"
      authorization:
        id: "rule-table"
        params:
          allow: "shout"
          deny: "whisper"
    transport:
      id: "http"
      params:
        host: "localhost"
        port: "8082"
    serializer:
      id: "json"
    authentication:
      id: "shared-secret"
      params:
        secret: "${GATEWAY_A_SECRET:-s3cr3t-a}"
        subject: "gateway-a"

  - id: "gateway-b-to-backend"
    caller:
      nodeId: "gateway-bNode"
    callee:
      nodeId: "backendNode"
      authorization:
        id: "rule-table"
        params:
          allow: "shout"
          deny: "whisper"
    transport:
      id: "http"
      params:
        host: "localhost"
        port: "8082"
    serializer:
      id: "json"
    authentication:
      id: "shared-secret"
      params:
        secret: "${GATEWAY_B_SECRET:-not-the-real-secret}"
        subject: "gateway-b"