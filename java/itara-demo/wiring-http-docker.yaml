nodes:
  - id: "gatewayNode"
    component: "gateway"

  - id: "calculatorNode"
    component: "calculator"

connections:
  - from: "gatewayNode"
    to: "calculatorNode"
    transport:
      id: http
      params:
        host: "calculator"
        port: 8081
    serializer: "json"

  - from:
    to: "gatewayNode"
    transport:
      id: http
      params:
        port: 8082
    serializer: "json"