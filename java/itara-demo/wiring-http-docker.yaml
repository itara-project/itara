nodes:
  - id: "gatewayNode"
    component: "gateway"

  - id: "calculatorNode"
    component: "calculator"

connections:
  - from: "gatewayNode"
    to: "calculatorNode"
    type: http
    host: "calculator"
    port: 8081
    serializer: "json"

  - from:
    to: "gatewayNode"
    type: http
    port: 8082
    serializer: "json"