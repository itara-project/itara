nodes:
  - id: "gatewayNode"
    component: "gateway"

  - id: "calculatorNode"
    component: "calculator"

connections:
  - id: "conn-001"
    from: "gatewayNode"
    to: "calculatorNode"
    transport:
      id: http
      params:
        host: "calculator"
        port: 8081
    serializer:
      id: "json"

  - id: "conn-002"
    from:
    to: "gatewayNode"
    transport:
      id: http
      params:
        port: 8082
    serializer:
      id: "json"