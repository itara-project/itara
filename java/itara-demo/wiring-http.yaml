nodes:
  - id: "gatewayNode"
    component: "gateway"

  - id: "calculatorNode"
    component: "calculator"

connections:
  - id: "conn-001"
    from: "gatewayNode"
    to: "calculatorNode"
    transport:
      id: http
      params:
        host: "localhost"
        port: 8081
    serializer:
      id: "json"