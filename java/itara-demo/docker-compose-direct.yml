name: itara-demo-direct

# Demonstrates direct (colocated) topology.
# Both gateway and calculator run in the same container, same JVM.
# No network communication between components — pure method calls.
# Change to docker-compose-http.yml to see the same code over HTTP instead.

services:
  itara-demo:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ../itara-core/target/itara-core-0.1.0.jar:/app/itara-core.jar:ro
      - ../itara-agent/target/itara-agent-0.1.0.jar:/app/itara-agent.jar:ro
      - ./calculator-api/target/calculator-api-0.1.0.jar:/app/calculator-api.jar:ro
      - ./calculator-component/target/calculator-component-0.1.0.jar:/app/calculator-component.jar:ro
      - ./gateway-api/target/gateway-api-0.1.0.jar:/app/gateway-api.jar:ro
      - ./gateway-component/target/gateway-component-0.1.0.jar:/app/gateway-component.jar:ro
      - ./wiring-direct.yaml:/app/config/wiring-direct.yaml:ro
      - ./libs:/app/libs:ro
      - ./calculator-api/calculator-api.itara:/app/metafiles/calculator-api.itara:ro
      - ./calculator-component/calculator-component.itara:/app/metafiles/calculator-component.itara:ro
      - ./gateway-api/gateway-api.itara:/app/metafiles/gateway-api.itara:ro
      - ./gateway-component/gateway-component.itara:/app/metafiles/gateway-component.itara:ro
    command:
      - "-Ditara.config=/app/config/wiring-direct.yaml"
      - "-Ditara.lib.dir=/app/libs"
      - "-Ditara.metadata.dir=/app/metafiles"
      - "-Ditara.nodes=calculatorNode,gatewayNode"
      - "-javaagent:/app/itara-agent.jar"
      - "-cp"
      - "/app/itara-core.jar:/app/calculator-api.jar:/app/calculator-component.jar:/app/gateway-api.jar:/app/gateway-component.jar"
      - "demo.gateway.component.DemoMain"
