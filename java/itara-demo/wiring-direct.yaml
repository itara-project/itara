# wiring-direct.yaml
# Both components run in the same JVM.
# Gateway calls Calculator as a direct method call — no network involved.

nodes:
  - id: "gatewayNode"
    component: "gateway"

  - id: "calculatorNode"
    component: "calculator"

connections:
  - from: "gatewayNode"
    to: "calculatorNode"
    transport:
      id: "direct"
