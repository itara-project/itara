nodes:
  - id: "orderProducerNode"
    component: "order-producer"
  - id: "orderConsumerNode"
    component: "order-consumer"
  - id: "orderPlacedChannel"
    kind: virtual
    contract: "order-events/order-placed"
    address: "demo.events.order-placed"
  - id: "orderCancelledChannel"
    kind: virtual
    contract: "order-events/order-cancelled"
    address: "demo.events.order-cancelled"
  - id: "paymentMadeChannel"
    kind: virtual
    contract: "payment-events/payment-made"
    address: "demo.events.payment-made"

connections:
  - id: "order-producer-001"
    from:
    to: "orderProducerNode"
    transport:
      id: http
      params:
        host: localhost
        port: 8081
    serializer:
      id: "json"
  - id: "order-producer-002"
    from: "orderProducerNode"
    to: "orderPlacedChannel"
    transport:
      id: kafka
      params:
        bootstrapServers: "localhost:9092"
    serializer:
      id: "json"
  - id: "order-producer-003"
    from: "orderProducerNode"
    to: "orderCancelledChannel"
    transport:
      id: kafka
      params:
        bootstrapServers: "localhost:9092"
    serializer:
      id: "json"
  - id: "order-producer-004"
    from: "orderProducerNode"
    to: "paymentMadeChannel"
    transport:
      id: kafka
      params:
        bootstrapServers: "localhost:9092"
    serializer:
      id: "json"
  - id: "order-consumer-001"
    from: "orderPlacedChannel"
    to: "orderConsumerNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "localhost:9092"
        consumerGroup: "order-consumer-group"
    serializer:
      id: "json"
  - id: "order-consumer-002"
    from: "orderCancelledChannel"
    to: "orderConsumerNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "localhost:9092"
        consumerGroup: "order-consumer-group"
    serializer:
      id: "json"
  - id: "order-consumer-003"
    from: "paymentMadeChannel"
    to: "orderConsumerNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "localhost:9092"
        consumerGroup: "order-consumer-group"
    serializer:
      id: "json"