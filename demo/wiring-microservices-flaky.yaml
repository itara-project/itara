nodes:
  - id: "fulfilmentNode"
    component: "fulfilment"
  - id: "inventoryNode"
    component: "inventory"
  - id: "notificationNode"
    component: "notification"
  - id: "paymentNode"
    component: "payment"
  - id: "orderNode"
    component: "order"
  - id: "orderReservedChannel"
    kind: virtual
    contract: "order-events/order-reserved"
    address: "demo.events.order-reserved"
  - id: "orderFulfilledChannel"
    kind: virtual
    contract: "fulfilment-events/order-fulfilled"
    address: "demo.events.order-fulfilled"
  - id: "orderCancelledChannel"
    kind: virtual
    contract: "fulfilment-events/order-cancelled"
    address: "demo.events.order-cancelled"

connections:
  - from:
    to: "orderNode"
    transport:
      id: http
      params:
        host: "order"
        port: 8081
    serializer: "json"
  - from:
    to: "inventoryNode"
    transport:
      id: http
      params:
        host: "inventory"
        port: 8082
    serializer: "json"
  - from: "orderNode"
    to: "paymentNode"
    transport:
      id: http
      handleTimeout: true
      params:
        host: "payment"
        port: 8083
    serializer: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
  - from: "orderNode"
    to: "inventoryNode"
    transport:
      id: flaky-http
      handleTimeout: true
      params:
        host: "inventory"
        port: 8087
    serializer: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
  - from: "orderNode"
    to: "fulfilmentNode"
    transport:
      id: flaky-http
      handleTimeout: true
      params:
        host: "fulfilment"
        port: 8085
    serializer: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
  - from: "orderNode"
    to: orderReservedChannel
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
    serializer: "json"
  - from: "orderNode"
    to: orderFulfilledChannel
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
    serializer: "json"
  - from: "orderNode"
    to: orderCancelledChannel
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
    serializer: "json"
  - from: "orderReservedChannel"
    to: "notificationNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
        consumerGroup: "order-consumer-group"
    serializer: "json"
  - from: "orderFulfilledChannel"
    to: "notificationNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
        consumerGroup: "order-consumer-group"
    serializer: "json"
  - from: "orderCancelledChannel"
    to: "notificationNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
        consumerGroup: "order-consumer-group"
    serializer: "json"