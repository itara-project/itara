nodes:
  - id: "fulfilmentNode"
    component: "fulfilment"
  - id: "inventoryNode"
    component: "inventory"
  - id: "notificationNode"
    component: "notification"
  - id: "paymentNode"
    component: "payment"
  - id: "orderNode"
    component: "order"
  - id: "orderReservedChannel"
    kind: virtual
    contract: "order-events/order-reserved"
    address: "demo.events.order-reserved"
  - id: "orderFulfilledChannel"
    kind: virtual
    contract: "fulfilment-events/order-fulfilled"
    address: "demo.events.order-fulfilled"
  - id: "orderCancelledChannel"
    kind: virtual
    contract: "fulfilment-events/order-cancelled"
    address: "demo.events.order-cancelled"

connections:
  - id: "external-to-order"
    from:
    to: "orderNode"
    transport:
      id: http
      params:
        host: "order_and_inventory"
        port: 8081
    serializer:
      id: "json"
  - id: "external-to-inventory"
    from:
    to: "inventoryNode"
    transport:
      id: http
      params:
        host: "order_and_inventory"
        port: 8081
    serializer:
      id: "json"
  - id: "order-to-payment"
    from: "orderNode"
    to: "paymentNode"
    transport:
      id: http
      handleTimeout: true
      params:
        host: "payment"
        port: 8083
    serializer:
      id: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
  - id: "order-to-inventory"
    from: "orderNode"
    to: "inventoryNode"
    transport:
      id: direct
  - id: "order-to-fulfilment"
    from: "orderNode"
    to: "fulfilmentNode"
    transport:
      id: http
      handleTimeout: true
      params:
        host: "fulfilment"
        port: 8085
    serializer:
      id: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
  - id: "order-to-orderReserved"
    from: "orderNode"
    to: orderReservedChannel
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
    serializer:
      id: "json"
  - id: "order-to-orderFulfilled"
    from: "orderNode"
    to: orderFulfilledChannel
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
    serializer:
      id: "json"
  - id: "order-to-orderCancelled"
    from: "orderNode"
    to: orderCancelledChannel
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
    serializer:
      id: "json"
  - id: "orderReserved-to-notification"
    from: "orderReservedChannel"
    to: "notificationNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
        consumerGroup: "order-consumer-group"
    serializer:
      id: "json"
  - id: "orderFulfilled-to-notification"
    from: "orderFulfilledChannel"
    to: "notificationNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
        consumerGroup: "order-consumer-group"
    serializer:
      id: "json"
  - id: "orderCancelled-to-notification"
    from: "orderCancelledChannel"
    to: "notificationNode"
    transport:
      id: kafka
      params:
        bootstrapServers: "kafka:29092"
        consumerGroup: "order-consumer-group"
    serializer:
      id: "json"