nodes:
  - id: "fulfilmentNode"
    component: "fulfilment"
  - id: "inventoryNode"
    component: "inventory"
  - id: "notificationNode"
    component: "notification"
  - id: "paymentNode"
    component: "payment"
  - id: "orderNode"
    component: "order"

connections:
  - from:
    to: "orderNode"
    transport:
      id: http
      params:
        host: "order_and_inventory"
        port: 8081
    serializer: "json"
  - from:
    to: "inventoryNode"
    transport:
      id: http
      params:
        host: "order_and_inventory"
        port: 8082
    serializer: "json"
  - from: "orderNode"
    to: "paymentNode"
    transport:
      id: http
      params:
        host: "payment"
        port: 8083
    serializer: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
  - from: "orderNode"
    to: "inventoryNode"
    transport:
      id: direct
  - from: "orderNode"
    to: "fulfilmentNode"
    transport:
      id: http
      params:
        host: "fulfilment"
        port: 8085
    serializer: "json"
    failureSemantics:
      id: built-in
      maxRetry: 3
      timeout: 5s
      params:
        waitDuration: 500ms
        retryRuntime: "true"
