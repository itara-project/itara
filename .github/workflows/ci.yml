name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test-java:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: java
    services:
      kafka:
        image: confluentinc/cp-kafka:7.7.1
        ports:
          - 9092:9092
        env:
          KAFKA_NODE_ID: 1
          KAFKA_PROCESS_ROLES: broker,controller
          KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
          KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
          KAFKA_ADVERTISED_LISTENERS: INTERNAL://localhost:29092,EXTERNAL://localhost:9092
          KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
          KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
          KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
          CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qg"
          KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
          KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
          KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'    # also add this — caches ~/.m2 between runs

      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
          maven-version: 3.9.6

      - name: Build all modules
        run: mvn install --no-transfer-progress

      - name: Run unit and integration tests
        run: mvn test --no-transfer-progress

      - name: Make CI scripts executable
        # Required for local testing with 'act' on Windows.
        # Windows NTFS does not preserve Unix execute bits when act mounts
        # the working directory into the Docker container.
        # On the real GitHub runner this is a no-op — git checkout
        # restores the executable bit from the git index correctly.
        run: chmod +x ci/*.sh

      - name: Run demo (direct topology)
        run: ci/run-demo-direct.sh

      - name: Run demo (HTTP topology)
        run: ci/run-demo-http.sh

      - name: Run demo (events topology)
        run: ci/run-demo-events.sh
 
  build-and-test-rust:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: rust
 
    steps:
      - name: Checkout
        uses: actions/checkout@v4
 
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
 
      - name: Cache Cargo registry and build artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust
 
      - name: Build
        run: cargo build --workspace --locked
 
      - name: Run tests
        run: cargo test --workspace --locked
