nodes:
  - id: nodeA
    component: compA
  - id: nodeB
    component: compB
  - id: nodeC
    component: compC

connections:
  - id: "external-to-nodeA"
    to: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "nodeA-to-nodeB"
    from: nodeA
    to: nodeB
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
  - id: "nodeA-to-undeclared"
    from: nodeA
    to: undeclaredNode
    transport:
      id: http
      params:
        port: "8082"
    serializer:
      id: json
  - id: "nodeB-self"
    from: nodeB
    to: nodeB
    transport:
      id: http
      params:
        port: "8083"
    serializer:
      id: json
