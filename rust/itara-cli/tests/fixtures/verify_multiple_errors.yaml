nodes:
  - id: nodeA
    component: compA
  - id: nodeB
    component: compB
  - id: nodeC
    component: compC

connections:
  - id: "external-to-nodeA"
    callee:
      nodeId: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "nodeA-to-nodeB"
    caller:
      nodeId: nodeA
    callee:
      nodeId: nodeB
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
  - id: "nodeA-to-undeclared"
    caller:
      nodeId: nodeA
    callee:
      nodeId: undeclaredNode
    transport:
      id: http
      params:
        port: "8082"
    serializer:
      id: json
  - id: "nodeB-self"
    caller:
      nodeId: nodeB
    callee:
      nodeId: nodeB
    transport:
      id: http
      params:
        port: "8083"
    serializer:
      id: json
