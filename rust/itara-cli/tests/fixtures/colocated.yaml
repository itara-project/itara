nodes:
  - id: gatewayNode
    component: gateway
  - id: calculatorNode
    component: calculator
  - id: notifierNode
    component: notifier

connections:
  - id: "external-to-gateway"
    to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-calculator"
    from: gatewayNode
    to: calculatorNode
    transport:
      id: direct
  - id: "gateway-to-notifier"
    from: gatewayNode
    to: notifierNode
    transport:
      id: http
      params:
        port: "8090"
    serializer:
      id: json
