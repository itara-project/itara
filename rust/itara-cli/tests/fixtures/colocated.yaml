nodes:
  - id: gatewayNode
    component: gateway
  - id: calculatorNode
    component: calculator
  - id: notifierNode
    component: notifier

connections:
  - to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
  - from: gatewayNode
    to: calculatorNode
    transport:
      id: direct
  - from: gatewayNode
    to: notifierNode
    transport:
      id: http
      params:
        port: "8090"
