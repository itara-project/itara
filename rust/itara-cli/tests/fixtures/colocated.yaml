nodes:
  - id: gatewayNode
    component: gateway
  - id: calculatorNode
    component: calculator
  - id: notifierNode
    component: notifier

connections:
  - id: "external-to-gateway"
    callee:
      nodeId: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-calculator"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: calculatorNode
    transport:
      id: direct
  - id: "gateway-to-notifier"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: notifierNode
    transport:
      id: http
      params:
        port: "8090"
    serializer:
      id: json
