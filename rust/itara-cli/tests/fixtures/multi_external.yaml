nodes:
  - id: apiNode
    component: api
  - id: workerNode
    component: worker

connections:
  - id: "external-to-api-8080"
    callee:
      nodeId: apiNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "external-to-api-9090"
    callee:
      nodeId: apiNode
    transport:
      id: http
      params:
        port: "9090"
    serializer:
      id: json
  - id: "api-to-worker"
    caller:
      nodeId: apiNode
    callee:
      nodeId: workerNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
