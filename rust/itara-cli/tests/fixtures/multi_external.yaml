nodes:
  - id: apiNode
    component: api
  - id: workerNode
    component: worker

connections:
  - to: apiNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - to: apiNode
    transport:
      id: http
      params:
        port: "9090"
    serializer:
      id: json
  - from: apiNode
    to: workerNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
