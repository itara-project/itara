nodes:
  - id: nodeA
    component: compA
  - id: nodeA
    component: compA-duplicate
  - id: nodeB
    component: compB

connections:
  - id: "external-to-nodeA"
    to: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "nodeA-to-nodeB"
    from: nodeA
    to: nodeB
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
