nodes:
  - id: nodeA
    component: compA
  - id: nodeA
    component: compA-duplicate
  - id: nodeB
    component: compB

connections:
  - id: "external-to-nodeA"
    callee:
      nodeId: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "nodeA-to-nodeB"
    caller:
      nodeId: nodeA
    callee:
      nodeId: nodeB
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
