nodes:
  - id: nodeA
    component: compA
  - id: nodeA
    component: compA-duplicate
  - id: nodeB
    component: compB

connections:
  - to: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - from: nodeA
    to: nodeB
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
