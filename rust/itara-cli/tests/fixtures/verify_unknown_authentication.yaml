nodes:
  - id: gatewayNode
    component: gateway
  - id: workerNode
    component: worker

connections:
  - id: "external-to-gateway"
    callee:
      nodeId: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-worker"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: workerNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
    authentication:
      id: shared-secret
      params:
        secret: "s3cr3t"