nodes:
  - id: gatewayNode
    component: gateway
  - id: serviceANode
    component: serviceA
  - id: serviceBNode
    component: serviceB

connections:
  - to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
  - from: gatewayNode
    to: serviceANode
    transport:
      id: http
      params:
        port: "8081"
  - from: gatewayNode
    to: serviceBNode
    transport:
      id: http
      params:
        port: "8082"
