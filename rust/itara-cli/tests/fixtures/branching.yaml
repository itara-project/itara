nodes:
  - id: gatewayNode
    component: gateway
  - id: serviceANode
    component: serviceA
  - id: serviceBNode
    component: serviceB

connections:
  - id: "external-to-gateway"
    callee:
      nodeId: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-serviceA"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: serviceANode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
  - id: "gateway-to-serviceB"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: serviceBNode
    transport:
      id: http
      params:
        port: "8082"
    serializer:
      id: json
