nodes:
  - id: gatewayNode
    component: gateway
  - id: serviceANode
    component: serviceA
  - id: serviceBNode
    component: serviceB

connections:
  - id: "external-to-gateway"
    to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-serviceA"
    from: gatewayNode
    to: serviceANode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
  - id: "gateway-to-serviceB"
    from: gatewayNode
    to: serviceBNode
    transport:
      id: http
      params:
        port: "8082"
    serializer:
      id: json
