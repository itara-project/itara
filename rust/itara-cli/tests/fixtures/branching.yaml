nodes:
  - id: gatewayNode
    component: gateway
  - id: serviceANode
    component: serviceA
  - id: serviceBNode
    component: serviceB

connections:
  - to: gatewayNode
    type: http
    port: 8080
  - from: gatewayNode
    to: serviceANode
    type: http
    port: 8081
  - from: gatewayNode
    to: serviceBNode
    type: http
    port: 8082
