nodes:
  - id: gatewayNode
    component: gateway

connections:
  - id: "external-to-gateway"
    to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-undeclared"
    from: gatewayNode
    to: undeclaredNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
