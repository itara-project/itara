nodes:
  - id: gatewayNode
    component: gateway

connections:
  - id: "external-to-gateway"
    callee:
      nodeId: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-undeclared"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: undeclaredNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
