nodes:
  - id: gatewayNode
    component: gateway
  - id: calculatorNode
    component: calculator
  - id: orphanNode
    component: orphan

connections:
  - to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - from: gatewayNode
    to: calculatorNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
