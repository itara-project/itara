nodes:
  - id: gatewayNode
    component: gateway
  - id: calculatorNode
    component: calculator
  - id: orphanNode
    component: orphan

connections:
  - id: "external-to-gateway"
    to: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-calculator"
    from: gatewayNode
    to: calculatorNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
