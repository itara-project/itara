nodes:
  - id: gatewayNode
    component: gateway
  - id: calculatorNode
    component: calculator
  - id: orphanNode
    component: orphan

connections:
  - id: "external-to-gateway"
    callee:
      nodeId: gatewayNode
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "gateway-to-calculator"
    caller:
      nodeId: gatewayNode
    callee:
      nodeId: calculatorNode
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
