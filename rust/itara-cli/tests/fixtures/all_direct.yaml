nodes:
  - id: nodeA
    component: compA
  - id: nodeB
    component: compB
  - id: nodeC
    component: compC

connections:
  - id: "external-to-nodeA"
    callee:
      nodeId: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "nodeA-to-nodeB"
    caller:
      nodeId: nodeA
    callee:
      nodeId: nodeB
    transport:
      id: direct
  - id: "nodeB-to-nodeC"
    caller:
      nodeId: nodeB
    callee:
      nodeId: nodeC
    transport:
      id: direct
