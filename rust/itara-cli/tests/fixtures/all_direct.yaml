nodes:
  - id: nodeA
    component: compA
  - id: nodeB
    component: compB
  - id: nodeC
    component: compC

connections:
  - id: "external-to-nodeA"
    to: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "nodeA-to-nodeB"
    from: nodeA
    to: nodeB
    transport:
      id: direct
  - id: "nodeB-to-nodeC"
    from: nodeB
    to: nodeC
    transport:
      id: direct
