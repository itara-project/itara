nodes:
  - id: nodeA
    component: compA
  - id: nodeB
    component: compB
  - id: nodeC
    component: compC

connections:
  - to: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - from: nodeA
    to: nodeB
    transport:
      id: direct
  - from: nodeB
    to: nodeC
    transport:
      id: direct
