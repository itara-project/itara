nodes:
  - id: nodeA
    component: compA
  - id: nodeB
    component: compB

connections:
  - id: "external-to-nodeA"
    callee:
      nodeId: nodeA
    transport:
      id: http
      params:
        port: "8080"
    serializer:
      id: json
  - id: "shared-id"
    caller:
      nodeId: nodeA
    callee:
      nodeId: nodeB
    transport:
      id: http
      params:
        port: "8081"
    serializer:
      id: json
  - id: "shared-id"
    caller:
      nodeId: nodeB
    callee:
      nodeId: nodeA
    transport:
      id: http
      params:
        port: "8082"
    serializer:
      id: json