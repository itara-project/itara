[package]
name = "itara-cli"
version = "0.1.0"
edition = "2021"
description = "Command-line tooling for Itara wiring configs"

[[bin]]
name = "itara"
path = "src/main.rs"

[dependencies]
itara-config = { path = "../itara-config" }
clap = { version = "4", features = ["derive"] }
 
[dev-dependencies]
assert_cmd = "2"
predicates = "3"
